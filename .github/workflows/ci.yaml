name: Build & Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Test (Java 21)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      # Enforce Quarkus code formatting rules inherited from quarkiverse-parent
      - name: Verify Code Formatting
        run: |
          ./mvnw -B process-sources
          git diff --exit-code || (echo "Formatting issues detected. Run './mvnw process-sources' locally." && exit 1)

      # Executes unit tests and Dev Services integration tests
      - name: Build and Run Tests
        run: ./mvnw -B clean verify