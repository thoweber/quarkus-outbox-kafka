name: Build & Test

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Test (JVM)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Cache SonarCloud Packages
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      # Enforce Quarkus code formatting rules inherited from quarkiverse-parent
      - name: Verify Code Formatting
        run: |
          ./mvnw -B process-sources
          git diff --exit-code || (echo "Formatting issues detected. Run './mvnw process-sources' locally." && exit 1)

      # Executes unit tests and Dev Services integration tests with JaCoCo coverage
      - name: Build and Run Tests
        run: ./mvnw -B clean verify

      # Executes SonarCloud static analysis and Quality Gate check
      - name: SonarCloud Analysis
        if: ${{ secrets.SONAR_TOKEN != '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: ./mvnw -B sonar:sonar -Dsonar.qualitygate.wait=true

  native:
    name: Native Integration Tests
    needs: build
    runs-on: ubuntu-latest
    # For pull requests, gate execution behind the manual review environment.
    # For direct pushes and merges to main/master, run automatically.
    environment: ${{ github.event_name == 'pull_request' && 'native-integration-tests' || '' }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Mandrel (GraalVM 21)
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: '21'
          distribution: 'mandrel'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cache: 'maven'

      - name: Run Native Integration Tests
        run: ./mvnw -B verify -pl integration-tests -Dnative
